name: RoomScanStudio CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: roomscanstudio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Static, package, build, and UI tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Capture Apple build environment
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes

      - name: Run host structural verifier
        run: python3 -B Scripts/verify_xcode_scaffold.py

      - name: Exercise pure simulator selector policy
        run: python3 -B Scripts/select_simulators.py --self-test

      - name: Run portable RoomScanCore tests
        run: swift test

      - name: Resolve local Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project RoomScanStudio.xcodeproj

      - name: Build unsigned generic iOS application
        run: >-
          xcodebuild -project RoomScanStudio.xcodeproj
          -scheme RoomScanStudio
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/RoomScanStudio-build-derived"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      - name: Inspect compiled iOS professional-boundary artifact
        run: >-
          python3 -B Scripts/inspect_ios_artifact.py
          --app "$RUNNER_TEMP/RoomScanStudio-build-derived/Build/Products/Debug-iphoneos/RoomScanStudio.app"
          --output "$RUNNER_TEMP/RoomScanStudio-artifact-inspection.json"

      - name: Select available iPhone and iPad simulators
        id: simulators
        run: python3 -B Scripts/select_simulators.py --github-output "$GITHUB_OUTPUT"

      - name: Run iPhone UI tests
        run: >-
          xcodebuild -project RoomScanStudio.xcodeproj
          -scheme RoomScanStudio
          -destination '${{ steps.simulators.outputs.iphone_destination }}'
          -resultBundlePath "$RUNNER_TEMP/RoomScanStudio-iPhone.xcresult"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test

      - name: Run iPad UI tests
        run: >-
          xcodebuild -project RoomScanStudio.xcodeproj
          -scheme RoomScanStudio
          -destination '${{ steps.simulators.outputs.ipad_destination }}'
          -resultBundlePath "$RUNNER_TEMP/RoomScanStudio-iPad.xcresult"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test

      - name: Upload XCTest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RoomScanStudio-xcresults
          path: |
            ${{ runner.temp }}/RoomScanStudio-iPhone.xcresult
            ${{ runner.temp }}/RoomScanStudio-iPad.xcresult
            ${{ runner.temp }}/RoomScanStudio-artifact-inspection.json
          if-no-files-found: warn
          retention-days: 7

  hosted-verification:
    name: Hosted service, PostgreSQL, infrastructure, and static proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Check out source without retaining a GitHub credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up exact Node.js 24 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'

      - name: Install local PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          if [ -d /etc/postgresql/16/main ]; then
            sudo pg_ctlcluster 16 main stop
          fi
          /usr/lib/postgresql/16/bin/postgres --version

      - name: Run offline hosted, real-role PostgreSQL, and artifact matrices
        run: >-
          python3 -B Scripts/verify_slice4_hosted.py
          --artifacts-dir "$RUNNER_TEMP/roomscan-slice4-hosted"

      - name: Upload hosted verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RoomScanStudio-slice4-hosted-verification
          path: ${{ runner.temp }}/roomscan-slice4-hosted
          if-no-files-found: error
          retention-days: 7
